services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: soup
      POSTGRES_PASSWORD: soup
      POSTGRES_DB: soup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["5432:5432"]

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://soup:soup@db:5432/soup
      ADMIN_TOKEN: dev-admin-token
      # enables /_test/* and the X-Test-Fault header. Never set this in production.
      SOUP_TEST_HOOKS: "1"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 30

  # docker compose run --rm tests
  tests:
    build: ./tests
    profiles: ["test"]
    environment:
      BASE_URL: http://app:8000
      DATABASE_URL: postgresql://soup:soup@db:5432/soup
      ADMIN_TOKEN: dev-admin-token
    depends_on:
      app: { condition: service_healthy }
    volumes:
      - ./results:/results
