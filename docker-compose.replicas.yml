# Two app replicas behind nginx:
#   docker compose -f docker-compose.yml -f docker-compose.replicas.yml up -d --build --wait
services:
  app:
    deploy: { replicas: 2 }
    ports: !reset []
  lb:
    image: nginx:1.27-alpine
    volumes: ["./lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      app: { condition: service_healthy }
    ports: ["8000:8000"]
  tests:
    environment:
      BASE_URL: http://lb:8000
    depends_on:
      lb: { condition: service_started }
