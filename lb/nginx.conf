# Round-robin over every IP that "app" resolves to (one per replica).
upstream soup { server app:8000; keepalive 64; }
server {
  listen 8000;
  location / {
    proxy_pass http://soup;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # SSE: the app also sends X-Accel-Buffering: no; this is belt and braces
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
